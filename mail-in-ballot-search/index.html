<!DOCTYPE html>
<html lang="en">
<head>

    /* ===== Reset & Base ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e0ea;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ===== Layout ===== */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: clamp(1.35rem, 3.5vw, 1.75rem);
      font-weight: 700;
      background: linear-gradient(135deg, #c084fc, #a855f7, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.35rem;
    }

    .header p {
      font-size: 0.875rem;
      color: #9893a6;
    }

    /* ===== Search ===== */
    .search-wrap {
      position: relative;
      max-width: 480px;
      margin: 0 auto 2rem;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #7c6f99;
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: #e2e0ea;
      background: #1a1a2e;
      border: 1.5px solid #2d2b44;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    #search::placeholder { color: #5e5878; }

    #search:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
    }

    /* ===== Results Table ===== */
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #2d2b44;
      background: #13132200;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #1a1a2e;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a89cc8;
      padding: 0.85rem 1rem;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1.5px solid #2d2b44;
    }

    tbody td {
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      border-bottom: 1px solid #1e1e34;
      white-space: nowrap;
    }

    tbody tr {
      transition: background 0.15s;
    }

    tbody tr:hover {
      background: rgba(124, 58, 237, 0.08);
    }

    /* Name column styling */
    td.name-cell {
      font-weight: 600;
      color: #c084fc;
    }

    /* ===== Empty / Status ===== */
    .status {
      text-align: center;
      padding: 3rem 1rem;
      color: #5e5878;
      font-size: 0.9rem;
    }

    .status .icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    /* ===== Result count ===== */
    .result-count {
      font-size: 0.78rem;
      color: #6e6887;
      margin-bottom: 0.65rem;
      padding-left: 0.25rem;
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .container { padding: 1.25rem 0.75rem; }
      thead th, tbody td { padding: 0.6rem 0.65rem; font-size: 0.78rem; }
    }
  </style>

// ── DOM refs ──
const searchInput  = document.getElementById('search');
const tableBody    = document.getElementById('tableBody');
const statusEl     = document.getElementById('status');
const resultCount  = document.getElementById('resultCount');

// ── Render helpers ──
function formatNum(n) {
  return n.toLocaleString('en-US');
}

function formatPct(n) {
  return n.toFixed(2) + '%';
}

function renderRows(rows) {
  if (rows.length === 0) {
    tableBody.innerHTML = '';
    statusEl.style.display = 'block';
    statusEl.innerHTML = '<span class="icon">😕</span>No counties matched your search.';
    resultCount.textContent = '';
    return;
  }

  statusEl.style.display = 'none';
  resultCount.textContent = rows.length === DATA.length
    ? `Showing all ${rows.length} counties`
    : `${rows.length} result${rows.length > 1 ? 's' : ''} found`;

  tableBody.innerHTML = rows.map(r => `
    <tr>
      <td class="name-cell">${r.name}</td>
      <td>${formatNum(r.f1a)}</td>
      <td>${formatNum(r.mail)}</td>
      <td>${formatPct(r.turnout)}</td>
      <td>${formatPct(r.mailPct)}</td>
      <td>${formatNum(r.rejected)}</td>
      <td>${formatNum(r.late)}</td>
    </tr>
  `).join('');
}

// ── Search logic ──
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();

  if (q === '') {
    statusEl.style.display = 'block';
    statusEl.innerHTML = '<span class="icon">🔍</span>Start typing a county name above to see results.';
    tableBody.innerHTML = '';
    resultCount.textContent = '';
    return;
  }

  const filtered = DATA.filter(row => row.name.toLowerCase().includes(q));
  renderRows(filtered);
});

// Focus the search box on load
